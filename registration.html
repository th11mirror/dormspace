<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — DormSpace</title>
    <style>
        :root { --bg-color: #4682B4; --text-color: #FFFFFF; --accent-color: #DDA0DD; --font-family: system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        /* ЗВЕЗДОЧКИ */
        .star-svg { position: absolute; fill: var(--accent-color); opacity: 0.4; z-index: -1; animation: superPulse 4s infinite alternate ease-in-out; }
        .star-1 { top: 15%; left: 10%; width: 70px; height: 70px; animation-delay: 0s; }
        .star-2 { top: 75%; left: 85%; width: 50px; height: 50px; animation-delay: 1s; }
        .star-3 { top: 60%; left: 15%; width: 90px; height: 90px; animation-delay: 2s; }
        @keyframes superPulse { 0% { transform: scale(0.8) rotate(0deg); opacity: 0.2; } 100% { transform: scale(1.15) rotate(15deg); opacity: 0.6; } }

        /* ИСПРАВЛЕНО: Добавлен z-index: 10, чтобы шапка была поверх остальных элементов */
        header { width: 100%; padding: 25px 40px; display: flex; justify-content: center; position: absolute; top: 0; z-index: 10; }
        .header-content { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
        .logo:hover { color: var(--accent-color); }

        main { flex: 1; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .auth-card { background-color: #1a2633; padding: 50px 40px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .auth-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; color: var(--accent-color); }
        .auth-desc { font-size: 15px; opacity: 0.8; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; opacity: 0.9; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: none; background-color: #112233; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { box-shadow: 0 0 0 2px var(--accent-color); }
        
        .btn-submit { width: 100%; padding: 15px; border-radius: 12px; background-color: var(--accent-color); color: #1a2633; font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #EACEEA; transform: translateY(-2px); }
        
        .auth-footer { margin-top: 25px; font-size: 14px; opacity: 0.8; }
        .auth-footer a { color: var(--accent-color); font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <svg class="star-svg star-1" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>
    <svg class="star-svg star-2" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>
    <svg class="star-svg star-3" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">DORMSPACE</a>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <div class="auth-title">С возвращением</div>
            <div class="auth-desc">Войдите в систему управления DormSpace</div>
            
            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="student@university.by" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="button" class="btn-submit">Войти</button>
            </form>
            
            <div class="auth-footer">
                Нет аккаунта? <a href="#">Зарегистрироваться</a>
            </div>
        </div>
    </main>
</body>
</html>
