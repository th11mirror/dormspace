<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — DormSpace</title>
    <style>
        :root { --bg-color: #4682B4; --text-color: #FFFFFF; --accent-color: #DDA0DD; --btn-hover: #EACEEA; --font-family: system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; position: relative;}
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        /* ЗВЕЗДОЧКИ */
        .star-svg { position: absolute; fill: var(--accent-color); opacity: 0.4; z-index: -1; animation: superPulse 4s infinite alternate ease-in-out; }
        .star-1 { top: 15%; left: 8%; width: 75px; height: 75px; animation-delay: 0s; }
        .star-2 { top: 70%; left: 90%; width: 60px; height: 60px; animation-delay: 1s; }
        .star-3 { top: 85%; left: 15%; width: 40px; height: 40px; animation-delay: 2s; }
        @keyframes superPulse { 0% { transform: scale(0.8) rotate(0deg); opacity: 0.2; } 100% { transform: scale(1.15) rotate(15deg); opacity: 0.6; } }

        header { width: 100%; padding: 25px 40px; display: flex; justify-content: center; z-index: 10; }
        .header-content { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        .logo:hover { color: var(--accent-color); }
        nav ul { display: flex; list-style: none; gap: 35px; align-items: center; }
        nav a { font-weight: 600; font-size: 15px; opacity: 0.9; }
        nav a:hover { color: var(--accent-color); opacity: 1; }
        .btn-register { padding: 12px 26px; background-color: var(--accent-color); color: #4682B4; border: none; border-radius: 24px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(221, 160, 221, 0.25); }

        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; z-index: 1;}
        .contact-container { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1000px; width: 100%; align-items: center; }
        
        .contact-info h1 { font-size: 54px; font-weight: 900; color: var(--accent-color); margin-bottom: 20px; line-height: 1.1; text-transform: uppercase;}
        .contact-info p { font-size: 18px; line-height: 1.6; opacity: 0.9; margin-bottom: 40px; }
        .info-block { margin-bottom: 20px; }
        .info-block h3 { font-size: 14px; text-transform: uppercase; opacity: 0.6; margin-bottom: 5px; }
        .info-block a { font-size: 20px; font-weight: 700; }
        .info-block a:hover { color: var(--accent-color); }

        .contact-form { background-color: #1a2633; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 20px; }
        .input-group input, .input-group textarea { width: 100%; padding: 15px; border-radius: 12px; border: none; background-color: #112233; color: #fff; font-family: inherit; font-size: 15px; outline: none; }
        .input-group textarea { resize: vertical; min-height: 120px; }
        .btn-submit { width: 100%; padding: 15px; border-radius: 12px; background-color: var(--accent-color); color: #1a2633; font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #EACEEA; transform: translateY(-2px); }
    </style>
</head>
<body>
    <svg class="star-svg star-1" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>
    <svg class="star-svg star-2" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>
    <svg class="star-svg star-3" viewBox="0 0 24 24"><path d="M12 0l3.09 8.36L24 9.73l-6.18 5.73L19.45 24 12 19.77 4.55 24l1.63-8.54L0 9.73l8.91-1.37z"/></svg>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">DORMSPACE</a>
            <nav>
                <ul>
                    <li><a href="services.html">Услуги</a></li>
                    <li><a href="contact.html" style="color: var(--accent-color)">Контакты</a></li>
                    <li><a href="subscriptions.html">Подписки</a></li> 
                </ul>
            </nav>
            <a href="registration.html"><button class="btn-register">Войти / Регистрация</button></a>
        </div>
    </header>

    <main>
        <div class="contact-container">
            <div class="contact-info">
                <h1>Останемся на связи</h1>
                <p>Хотите внедрить DormSpace в свой университет или у вас есть вопросы по работе платформы? Напишите нам.</p>
                <div class="info-block">
                    <h3>Email для связи</h3>
                    <a href="mailto:hello@dormspace.by">hello@dormspace.by</a>
                </div>
                <div class="info-block">
                    <h3>Телефон</h3>
                    <a href="tel:+375290000000">+375 (29) 000-00-00</a>
                </div>
            </div>
            
            <div class="contact-form">
                <div class="input-group">
                    <input type="text" placeholder="Ваше имя" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <textarea placeholder="Сообщение..." required></textarea>
                </div>
                <button type="button" class="btn-submit">Отправить</button>
            </div>
        </div>
    </main>
</body>
</html>
